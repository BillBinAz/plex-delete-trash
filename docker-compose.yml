services:
  plex-delete-trash:
    container_name: plex-delete-trash
    image:  plex-delete-trash:latest
    restart: unless-stopped
    network_mode: bridge
    environment:
     # - PLEX_URL="<PLEX_URL>"
     # - PLEX_TOKEN=<PLEX_TOKEN>
      - PLEX_IDLE_TIME_MIN=15
      - PLEX_CRON_SCHEDULE="*/15 4 * * *"
      - TZ=America/Phoenix

